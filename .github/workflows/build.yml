# Builds SeqVerse (VST3 and CLAP) on Linux and Windows, runs the tests and uploads a zip as a workflow artifact.
# Runs on GitHub only after a push; nothing here is needed for local builds.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The build only reads the repository; the zip goes up as a workflow artifact.
permissions:
  contents: write

# Dependencies are pinned to exact commits: a tag can be moved to other code later.
env:
  JUCE_VERSION: "8.0.15"
  JUCE_COMMIT: 91ad83ae34a81e0833b1a2b0866f54846370ae53   # the commit of tag 8.0.15
  CLAP_JUCE_EXTENSIONS_COMMIT: 7adee3a1bd4684d4caa5601100e364abccff4b4d

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            generator: -G Ninja
          - name: Windows
            os: windows-2022
            generator: ""            # Visual Studio 2022 (MSVC), the default on this runner

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      - name: Fetch JUCE and clap-juce-extensions
        shell: bash
        run: |
          git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git _sdks/JUCE
          test "$(git -C _sdks/JUCE rev-parse HEAD)" = "$JUCE_COMMIT" || { echo "JUCE tag $JUCE_VERSION has moved"; exit 1; }
          git clone https://github.com/free-audio/clap-juce-extensions.git _sdks/clap-juce-extensions
          git -C _sdks/clap-juce-extensions checkout "$CLAP_JUCE_EXTENSIONS_COMMIT"
          git -C _sdks/clap-juce-extensions submodule update --init --recursive

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_DIR=_sdks/JUCE
          -DCLAP_JUCE_EXTENSIONS_DIR=_sdks/clap-juce-extensions

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel --target SeqVerse_VST3 SeqVerse_CLAP clap_test_host SeqVerseUiTest

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel --target SeqVerse_VST3 SeqVerse_CLAP

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(sed -n 's/^project(SeqVerse VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version" || { echo "no version in CMakeLists.txt"; exit 1; }
          mkdir -p dist
          cd build/SeqVerse_artefacts/Release
          zip -r "$GITHUB_WORKSPACE/dist/SeqVerse-${version}-Linux.zip" VST3/SeqVerse.vst3 CLAP/SeqVerse.clap
          cd "$GITHUB_WORKSPACE"
          unzip -l dist/*.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target package-windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeqVerse-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # On a tag (v1.0.0): make the release if it is not there yet, and add the zips
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SeqVerse ${TAG#v}" --notes "Added Windows platform support. Free software under the GNU AGPLv3. See README.md for install and the tests." || true
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
